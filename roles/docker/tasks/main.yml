---
- name: Ensure the target OS is Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Ubuntu"
      - ansible_facts["distribution_version"] is version("24.04", ">=")
    fail_msg: "This role supports Ubuntu 24.04 and newer versions only."

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: "{{ docker_apt_cache_valid_time }}"
  become: true

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download Docker official GPG key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_keyring_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Get target architecture
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: docker_dpkg_architecture
  changed_when: false

- name: Install python3-debian
  ansible.builtin.apt:
    name: python3-debian
    state: present
  become: true

- name: Configure Docker official APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - "{{ docker_apt_repository_url }}"
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - "{{ docker_dpkg_architecture.stdout }}"
    signed_by: "{{ docker_apt_keyring_path }}"
    state: present
  become: true

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ docker_apt_cache_valid_time }}"
  become: true

- name: Ensure Docker service is running and enabled
  ansible.builtin.service:
    name: "{{ docker_service_name }}"
    state: "{{ docker_service_state }}"
    enabled: "{{ docker_service_enabled }}"
  become: true

- name: Verify Docker CLI is available
  ansible.builtin.command:
    cmd: docker --version
  register: docker_version_output
  changed_when: false

- name: Display installed Docker version
  ansible.builtin.debug:
    msg: "{{ docker_version_output.stdout }}"