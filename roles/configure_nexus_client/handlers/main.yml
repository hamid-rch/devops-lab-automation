---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0

- name: Restart Docker
  ansible.builtin.service:
    name: docker
    state: restarted

- name: Restart systemd-resolved after DNS configuration
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted