---
- name: Create Grafana Alloy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ gitlab_alloy_config_dir }}"
    - "{{ gitlab_alloy_storage_dir }}"

- name: Deploy Grafana Alloy configuration
  ansible.builtin.template:
    src: alloy.config.j2
    dest: "{{ gitlab_alloy_config_dir }}/alloy.config"
    owner: root
    group: root
    mode: "0644"
  register: gitlab_alloy_config_template