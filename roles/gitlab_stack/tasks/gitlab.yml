---
- name: Create GitLab deployment and persistent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ gitlab_stack_dir }}"
    - "{{ gitlab_data_root }}"
    - "{{ gitlab_data_root }}/config"
    - "{{ gitlab_data_root }}/logs"
    - "{{ gitlab_data_root }}/data"

- name: Configure Grafana Alloy
  ansible.builtin.import_tasks: configure_alloy.yml
  when: gitlab_alloy_enabled | bool

- name: Render GitLab Compose configuration
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ gitlab_stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'
  register: gitlab_compose_template

- name: Validate rendered Compose configuration
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.yml config --quiet
    chdir: "{{ gitlab_stack_dir }}"
  changed_when: false


- name: Start or reconcile GitLab stack
  ansible.builtin.command:
    argv: >-
      {{
        [
          'docker',
          'compose',
          '-f',
          'docker-compose.yml',
          'up',
          '-d',
          '--no-deps',
          'gitlab'
        ]
        +
        (['alloy'] if gitlab_alloy_enabled | bool else [])
      }}
    chdir: "{{ gitlab_stack_dir }}"
  register: gitlab_compose_up
  changed_when: >-
    'Started' in gitlab_compose_up.stderr or
    'Created' in gitlab_compose_up.stderr or
    'Recreated' in gitlab_compose_up.stderr or
    'Started' in gitlab_compose_up.stdout or
    'Created' in gitlab_compose_up.stdout or
    'Recreated' in gitlab_compose_up.stdout


- name: Restart Alloy when configuration changes
  ansible.builtin.command:
    argv:
      - docker
      - restart
      - "{{ gitlab_alloy_container_name }}"
  when:
    - gitlab_alloy_enabled | bool
    - gitlab_alloy_config_template.changed
  changed_when: true

- name: Wait until GitLab container is running
  ansible.builtin.command:
    argv: [docker, inspect, --format, '{{ "{{.State.Running}}" }}', '{{ gitlab_container_name }}']
  register: gitlab_running
  until: gitlab_running.stdout == 'true'
  retries: 30
  delay: 10
  changed_when: false

- name: Ensure persistent Omnibus configuration exists
  ansible.builtin.stat:
    path: "{{ gitlab_data_root }}/config/gitlab.rb"
  register: gitlab_rb_stat

- name: Wait for Omnibus to create gitlab.rb on first boot
  ansible.builtin.wait_for:
    path: "{{ gitlab_data_root }}/config/gitlab.rb"
    state: present
    timeout: 600
  when: not gitlab_rb_stat.stat.exists

- name: Render managed monitoring configuration fragment
  ansible.builtin.template:
    src: monitoring.rb.j2
    dest: "{{ gitlab_stack_dir }}/monitoring.rb"
    owner: root
    group: root
    mode: '0644'
  register: gitlab_monitoring_fragment

- name: Read rendered monitoring fragment
  ansible.builtin.slurp:
    src: "{{ gitlab_stack_dir }}/monitoring.rb"
  register: gitlab_monitoring_fragment_content

- name: Add monitoring settings to persistent gitlab.rb
  ansible.builtin.blockinfile:
    path: "{{ gitlab_data_root }}/config/gitlab.rb"
    marker: '# {mark} ANSIBLE MANAGED GITLAB MONITORING'
    block: "{{ gitlab_monitoring_fragment_content.content | b64decode | trim }}"
    backup: true
  register: gitlab_rb_monitoring

- name: Reconfigure GitLab when monitoring settings change
  ansible.builtin.command:
    argv: [docker, exec, '{{ gitlab_container_name }}', gitlab-ctl, reconfigure]
  when: gitlab_rb_monitoring.changed
  changed_when: true

- name: Verify Mimir hostname resolves from GitLab container
  ansible.builtin.command:
    argv: [docker, exec, '{{ gitlab_container_name }}', getent, hosts, '{{ gitlab_mimir_host }}']
  register: gitlab_mimir_dns
  changed_when: false

- name: Display GitLab Mimir DNS resolution
  ansible.builtin.debug:
    msg: "{{ gitlab_mimir_dns.stdout }}"
