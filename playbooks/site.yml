- name: Configure MinIO bucket versioning
  hosts: minio_stack
  become: true
  roles:
    - minio_stack
  tasks:
    - name: Ensure versioning is enabled on the lab bucket
      ansible.builtin.include_role:
        name: minio_stack
        tasks_from: versioning